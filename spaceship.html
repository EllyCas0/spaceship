<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="player"></div>
    <div id="enemy-container"></div>
    <div id="bullets-container"></div>
    <div id="hud">
      <div id="score">Puntaje: 0</div>
      <div id="lives">Vidas: 3</div>
      <div id="level">Nivel: 1</div>
      <div id="high-score">Record: 0</div>
    </div>
    <div id="message" class="message">
      <h1>Space Invaders</h1>
      <p id="message-text">Flechas para moverte, espacio para disparar, P para pausar.</p>
      <button id="start-button" type="button">Jugar</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
